<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.babylonjs.com https://unpkg.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdn.babylonjs.com; worker-src 'self' blob:; base-uri 'self'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Void Supremacy 3D - Galactic Conquest</title>

    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://unpkg.com/earcut@2.2.4/dist/earcut.min.js"></script>

    <!-- Enhanced models (optional) -->
    <script src="../void-ships-enhanced.js?v=20260117"></script>
    <script src="../void-buildings-enhanced.js?v=20260117"></script>
    <script src="../void-ore-enhanced.js?v=20260117"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index.css?v=20260119">
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <!-- Selection Box (for drag-select) -->
    <div id="selectionBox"></div>

    <div id="hud">
        <!-- Resource Bar -->
        <div id="resourceBar">
            <div class="resource" id="credits">
                <span class="resource-icon">💰</span>
                <div>
                    <div class="resource-value" id="creditsValue">1000</div>
                    <div class="resource-label">Credits</div>
                </div>
            </div>
            <div class="resource" id="ore">
                <span class="resource-icon">🪨</span>
                <div>
                    <div class="resource-value" id="oreValue">0</div>
                    <div class="resource-label">Ore</div>
                </div>
            </div>
            <div class="resource" id="crystals">
                <span class="resource-icon">💎</span>
                <div>
                    <div class="resource-value" id="crystalsValue">0</div>
                    <div class="resource-label">Crystals</div>
                </div>
            </div>
            <div class="resource" id="energy">
                <span class="resource-icon">⚡</span>
                <div>
                    <div class="resource-value" id="energyValue">0/0</div>
                    <div class="resource-label">Energy</div>
                </div>
            </div>
            <div class="resource" id="supply">
                <span class="resource-icon">👥</span>
                <div>
                    <div class="resource-value" id="supplyValue">0/0</div>
                    <div class="resource-label">Supply</div>
                </div>
            </div>
        </div>

        <!-- Alerts -->
        <div id="alerts"></div>

        <!-- Minimap -->
        <div id="minimapContainer">
            <span id="minimapLabel">Tactical Map</span>
            <canvas id="minimapCanvas"></canvas>
        </div>

        <!-- Bottom Bar Container for UI Panels -->
        <div id="bottomBar"></div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen">
        <div class="gameover-panel">
            <h1 id="resultTitle">VICTORY!</h1>
            <div class="gameover-divider"></div>
            <div class="final-stats">
                <div class="stat-cell">
                    <span class="stat-icon">🚀</span>
                    <span class="stat-value" id="finalBuilt">0</span>
                    <span class="stat-label">Units Built</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-icon">💥</span>
                    <span class="stat-value" id="finalLost">0</span>
                    <span class="stat-label">Units Lost</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-icon">☠️</span>
                    <span class="stat-value" id="finalKills">0</span>
                    <span class="stat-label">Enemy Destroyed</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-icon">🏭</span>
                    <span class="stat-value" id="finalBuildings">0</span>
                    <span class="stat-label">Buildings Built</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-icon">⏱️</span>
                    <span class="stat-value" id="finalTime">0:00</span>
                    <span class="stat-label">Match Time</span>
                </div>
                <div class="stat-cell hidden" id="waveCell">
                    <span class="stat-icon">🌊</span>
                    <span class="stat-value" id="finalWaves">0</span>
                    <span class="stat-label">Waves Survived</span>
                </div>
            </div>
            <button class="restart-btn" id="playAgainBtn">PLAY AGAIN</button>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <h1>VOID SUPREMACY</h1>
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
        <div id="loadingText">Initializing...</div>
    </div>

    <!-- Game Bootstrap (external for CSP: no inline script) -->
    <script type="module" src="./bootstrap.js?v=20260119"></script>
</body>
</html>
